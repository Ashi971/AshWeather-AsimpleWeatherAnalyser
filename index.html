<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <title>AshAbstract Weather</title>
    <script src="https://kit.fontawesome.com/c0d13b747c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script defer src="logic.js"></script>
</head>
<body>
    <!-- <nav style="background-color: transparent;">
        <div class="container">
            <h3 class="nav-text ">AshWeather</h3>
        </div>
    </nav> -->
    <div id="background" class="background">
        <div class="center-container">
            <div class="input-Container">
                <input id="inputSearchContent" style="border-color:blue; outline-style: none; height: inherit; border-width:  0px;width: 350px; border-style: none; text-align: center;  margin: 10px; " placeholder="Enter the City" type="text" name="" >
                <div id="searchIcon">    
                    <i  class="fa-solid fa-magnifying-glass" style="color: rgb(27, 26, 26);"></i>
                </div>    
            </div>
            <div class="season-banner">
                <img id="seasonImage" style="width: 250px; height: 250px; filter: drop-shadow(4px 4px 8px black);" class="season-img"
                src="sunny.png" alt="">
                <div id="seasonContent" class="seoson-content-container">
                    <h1 id="temp">26°C</h1>
                    <h2 id="seasonText" class="season-text">Sunny</h2>
                    <p style="font-style: italic;">"Good to go Outside and have fun"</p>
                    <div class="humidity-wind-container">
                        <div class="humidity">
                            <img src="humidity.png" alt="">
                            <div style="display: flex; flex-direction: column; ">
                                <h5 id="humidity">50%</h5>
                                <p>Humidity</p>
                            </div>
                        </div>
                        <div class="humidity" >
                            <img src="wind.png" alt="">
                            <div style="display: flex; flex-direction: column; ">
                                <h5 id="windSpeed">15km/h</h5>
                                <p>Wind</p>
                            </div>
                        </div>
                    </div>  
                </div>
                  
            </div>
        </div>
    </div>
</body>
</html>
